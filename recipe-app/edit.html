<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit recipe - Recipe App</title>
    <link href="/styles/styles.css" rel="stylesheet">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to recipe editor</a>

    <header class="header">
      <div class="container">
        <h1 class="header__title">Recipe App</h1>
        <p class="header__subtitle">Organize all your recipes!</p>
      </div>
    </header>

    <div class="actions">
      <div class="actions__container actions__container--spaced">
        <a href="/index.html">Go home</a>
        <span id="last-edited"></span>
      </div>
    </div>

    <main id="main-content" class="container-edit">
      <label class="visually-hidden" for="recipe-title">Recipe title</label>
      <input id="recipe-title" class="title-input" placeholder="Recipe title">

      <label class="visually-hidden" for="recipe-body">Recipe steps</label>
      <textarea id="recipe-body" class="body-input" placeholder="Enter recipe steps here"></textarea>

      <button id="remove-recipe" class="button button--secondary">Delete recipe</button>

      <section class="ingredients" aria-labelledby="ingredients-heading">
        <h2 id="ingredients-heading" class="visually-hidden">Ingredients</h2>
        <form id="add-ingredient">
          <label class="visually-hidden" for="ingredient-text">Add ingredient</label>
          <input id="ingredient-text" type="text" class="input" placeholder="Add ingredient" name="text">
          <button class="button" type="submit">Add ingredient</button>
        </form>
      </section>

      <div class="ingredients-body" aria-live="polite"></div>
    </main>

    <script src="/scripts/uuid.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.20.1/moment-with-locales.min.js"></script>
    <script src="/scripts/recipe-functions.js"></script>
    <script src="/scripts/recipe-edit.js"></script>
  </body>
</html>
